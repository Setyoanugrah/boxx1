name: molab-gpu

on:
  workflow_dispatch:
    inputs:
      notebook:
        required: true
      gpu_match:
        required: false
        default: "6000"
      list_only:
        required: false
        default: "1"

concurrency:
  group: molab-gpu-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: select
        env:
          MOLAB_COOKIES: ${{ secrets.MOLAB_COOKIES }}
          NB_URL: ${{ inputs.notebook }}
          GPU_MATCH: ${{ inputs.gpu_match }}
          GPU_LIST: ${{ inputs.list_only }}
        run: python3 -u repo/scripts/molab_gpu.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: molab-state
          path: /tmp/state.json
          if-no-files-found: ignore
