name: molab

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "create | list"
        required: false
        default: "create"

concurrency:
  group: molab-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  molab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Run
        env:
          MOLAB_COOKIES: ${{ secrets.MOLAB_COOKIES }}
          MODE: ${{ inputs.mode }}
        run: python3 -u repo/scripts/molab_new_nb.py

      - name: Upload state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molab-state
          path: /tmp/state.json
          if-no-files-found: ignore
